line-length = 100
target-version = "py311"

[lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]
ignore = ["E501"]

[lint.per-file-ignores]
"tests/*" = ["S101"]

[format]
quote-style = "double"
