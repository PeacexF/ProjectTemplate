[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "projtemp"
version = "0.1.0"
description = "Scatter a new project from the ProjectTemplate starting points."
readme = "projtemp/README.md"
requires-python = ">=3.9"
dependencies = ["click>=8.1"]

[project.scripts]
projtemp = "projtemp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["projtemp"]
